name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    name: test ${{ matrix.os }}
    env:
      PROJ_NETWORK: ON
      PROJ_USER_WRITABLE_DIRECTORY: ${{ github.workspace }}/.proj
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: |
          3.10
          3.11
          3.12
          3.13
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          tox.ini
    - name: Cache PROJ grids
      uses: actions/cache@v4
      with:
        path: .proj
        key: proj-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'tox.ini') }}
        restore-keys: |
          proj-${{ runner.os }}-
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
        python -c "from pathlib import Path; Path('.proj').mkdir(exist_ok=True)"
    - name: Lint and test with tox
      run: |
        tox run -e lint,py310,py311,py312,py313
    - name: Type check with pyright
      if: matrix.os == 'ubuntu-latest'
      run: |
        tox run -e pyright
